[package]
name = "horizon-bundle-inventory"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bundle Inventory: shift + right-click a bundle in your inventory for an interactive panel of its contents — click to take, shift-click to move, click items to put them in, Q to drop. A Horizon native mod."
publish = false

# The runtime doubles as the mod's library (its tests) and the module the
# bundle injects into the game; the helper files compile only inside it.
[lib]
path = "mixins/bundle_inventory/runtime.rs"
