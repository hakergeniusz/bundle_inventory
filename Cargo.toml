[package]
name = "bundle_inventory"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Bundle Inventory: shift + right-click a bundle in your inventory for an interactive panel of its contents — click to take, shift-click to move, click items to put them in, Q to drop. A Horizon native mod."
publish = false

[dependencies]
# The pinned SDK's API crate; the launcher stages its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
